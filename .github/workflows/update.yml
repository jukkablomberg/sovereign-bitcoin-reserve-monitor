name: Daily refresh

on:
  schedule:
    # 02:00 UTC daily — refreshes BTC price and derived fields.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        run: python3 scripts/update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "sovereign-btc-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/sovereigns.json)" ]]; then
            git add data/sovereigns.json
            git commit -m "data: daily refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
